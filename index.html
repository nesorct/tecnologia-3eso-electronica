<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electrónica 3º ESO - Tecnología</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, -apple-system, sans-serif; background: #1e1e1e; color: #f0f0f0; }
  header { padding: 16px 24px; background: #2c3e50; }
  header h1 { margin: 0; font-size: 1.3rem; }
  .tabs { display: flex; background: #34495e; }
  .tab {
    flex: 1; padding: 14px 20px; cursor: pointer; border: none; background: transparent;
    color: #ecf0f1; font-size: 1rem; font-weight: 600; border-bottom: 3px solid transparent;
    transition: background 0.2s, border-color 0.2s;
  }
  .tab:hover { background: #3d566e; }
  .tab.active { background: #1e1e1e; border-bottom-color: #3498db; color: #3498db; }
  .content { height: calc(100vh - 110px); }
  iframe { width: 100%; height: 100%; border: none; background: white; display: none; }
  iframe.active { display: block; }
</style>
</head>
<body>
  <header><h1>Electrónica - 3º ESO · Tecnología</h1></header>
  <div class="tabs">
    <button class="tab active" data-target="frame-esquema">📘 Esquema</button>
    <button class="tab" data-target="frame-quiz">📝 Quiz</button>
  </div>
  <div class="content">
    <iframe id="frame-esquema" class="active" src="esquema_electronica_3eso.html"></iframe>
    <iframe id="frame-quiz" src="electronica_quiz_3eso_v3.html"></iframe>
  </div>
  <script>
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.target).classList.add('active');
      });
    });
  </script>
</body>
</html>
